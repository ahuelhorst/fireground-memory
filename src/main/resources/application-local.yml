google:
  cloud:
    credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS}
    project-id: ${PROJECT_ID}
    speech:
      location: "global"
      model: "telephony"   # tuned for narrowband (8 kHz) audio like radio; "long" is the general alternative
      language: "en-US"
      stream-soft-limit: 240s   # after this, restart the Google stream at the next pause
      stream-hard-limit: 270s   # restart regardless (Google closes streams at ~5 min)

fireground:
  sse:
    heartbeat-interval: 15s     # ":keepalive" comment; detects dropped clients during radio silence